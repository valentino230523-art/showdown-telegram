<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pokémon Showdown</title>

  <!-- Script SDK ufficiale di Telegram per le Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #111;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <!-- Carica il client completo di Pokémon Showdown -->
  <iframe src="https://play.pokemonshowdown.com/" allow="autoplay; fullscreen"></iframe>

  <script>
    // Inizializza la finestra della Mini App dentro Telegram
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand(); // Espande la finestra a tutto schermo
    }
  </script>
</body>
</html>
